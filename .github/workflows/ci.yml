name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: uvx ruff check stern tests
      - name: Install
        run: uv sync --frozen
      - name: Test (everything except integration and system tests)
        run: uv run pytest -q -m "not integration and not system"
