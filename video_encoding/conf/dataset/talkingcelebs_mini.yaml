name: talkingcelebs_mini
role: ssl  # unlabelled SSL-adaptation set, no VA labels
present: true
path: ${oc.env:TALKINGCELEBS_MINI_ROOT,???}
manifest_path: ${.path}/manifest.csv
# Actual acquired size: 25 clips (~0.2h), 5 identities x 5 clips/identity --
# the full samarrik/talkingcelebs corpus only has 5 identities total (not
# the ~40 originally assumed), so this cap is "5 clips from each of the only
# 5 identities available", not an artificial restriction of a bigger pool.
target_hours: 0.2
holdout_identity_frac: 0.2  # only 5 identities total -> 1 held out; noted as fragile for the (paused) HPO phase
seed: 42
