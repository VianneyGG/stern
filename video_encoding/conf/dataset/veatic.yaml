name: veatic
role: probe            # 124 Hollywood/documentary/home-video clips, continuous per-frame VA (WACV 2024)
# `present: true` hardcoded here would be a lie for any checkout except
# login-node:/Data/$USER/veatic (fetched + manifest built there,
# 2026-07-07). Env-driven so it defaults safely to false everywhere else;
# set VEATIC_PRESENT=true on login-node before running. oc.decode parses the
# env var's string value as a real bool (a bare oc.env default would make
# VEATIC_PRESENT=false truthy, since any non-empty string is truthy).
present: ${oc.decode:${oc.env:VEATIC_PRESENT,false}}
# VA numeric range is NOT documented on the repo/paper/project page; [-1,1] was an educated guess,
# CONFIRMED against the real downloaded data (observed range across all 124 clips: [-0.9146, 0.8893]).
va_range: [-1.0, 1.0]
annotation_hz: 30.0   # approximate: VEATIC's ratings are 1:1 with extracted video frames (native fps varies per clip)
path: ${oc.env:VEATIC_ROOT,???}
manifest_path: ${oc.env:VEATIC_ROOT,???}/manifest.csv
