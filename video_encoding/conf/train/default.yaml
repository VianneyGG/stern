# Hyperparameter surface for video_encoding/probe/train.py (end-to-end VA fine-tune).
seed: 42
batch_size: 8            # ccc_loss is a batch statistic -- keep batches large enough to estimate variance
learning_rate: 1e-4     # random-init ViT-B trained from scratch on ~30k frames: keep the LR small to limit overfitting (plan self-critique #1)
epochs: 30
checkpoint_root: ${oc.env:STERN_CHECKPOINT_ROOT,/tmp/stern_checkpoints}
results_root: ${oc.env:STERN_RESULTS_ROOT,.claude/results}

grad_clip: 1.0          # clip_grad_norm_ max-norm; 0.0 disables. Guards against early-training gradient spikes on a random-init backbone
resume: true            # resume from checkpoint_root/<experiment>/latest.pt (or best.pt) if present
save_latest: true       # write a per-epoch snapshot for crash/preemption recovery
accum_steps: 1          # micro-steps per optimizer step (drives DDP static_graph choice in wrap_ddp AND gated by _train_epoch's no_sync loop)
num_workers: 8           # DataLoader workers; default 0 (serial decode) made a single VEATIC epoch exceed the 2h partition ceiling
ddp:
  bucket_cap_mb: 25     # tuned for 1GbE fabric (T3: NCCL busBW saturates at ~0.115 GB/s)
  grad_compress: ""     # "" | "fp16" -- halves NCCL bytes at negligible convergence cost
  nccl_timeout_sec: 300
  find_unused_parameters: false
  backend: nccl
  nccl_env: {}
pretrain_encoder_path: null   # path to Stage 1 SSL best.pt; null = train VA head + encoder from scratch
freeze_backbone: false        # true = frozen-encoder probe (only the VA head trains); false = end-to-end fine-tune
temporal_condition: normal    # normal | shuffled | frozen. Track P's control: shuffled
                              # destroys frame order while keeping every frame, so a CCC
                              # drop isolates temporal order from the domain gap.
probe_pred_dir: runs/results/probe_veatic   # where dump_probe_predictions writes its .npz
probe_checkpoint_label: latest              # names the .npz; paired with temporal_condition
