# Hyperparameter surface for video_encoding/training/pretrain_levjepa.py
# (LeVJEPA SIGReg SSL pretraining, single-node only).
seed: 42
batch_size: 16           # multi-view forward (global + num_local views) is memory-heavy per sample
lr: 1.5e-4                # flat peak LR consumed by _build_scheduler's warmup+cosine decay
weight_decay: 0.05        # AdamW weight decay (LeJEPA/MAE convention)
epochs: 100
warmup_epochs: 5          # linear warmup before cosine decay, via training.pretrain._build_scheduler
grad_clip_norm: 1.0       # clip_grad_norm_ max-norm over encoder+projector params
checkpoint_root: ${oc.env:STERN_CHECKPOINT_ROOT,/tmp/stern_checkpoints}
results_root: ${oc.env:STERN_RESULTS_ROOT,.claude/results}
resume: true              # resume from checkpoint_root/<experiment>/latest.pt if present
num_workers: 8             # DataLoader workers for the view-building loader
