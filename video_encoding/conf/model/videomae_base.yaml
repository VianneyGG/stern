# From-scratch VideoMAE-style video ViT (ViT-B geometry). No pretrained weights.
name: videomae_base
encoder: videomae
# --- input geometry ---
num_frames: 16
image_size: 224
in_channels: 3
tubelet_size: 2   # temporal patch depth (16 frames / 2 -> 8 tubelets)
patch_size: 16    # spatial patch (224 / 16 -> 14x14 grid); tokens = 8*14*14 = 1568
# --- transformer ---
embed_dim: 768
depth: 12
num_heads: 12
mlp_ratio: 4.0
dropout: 0.0
drop_path_rate: 0.0   # stochastic depth, linearly scaled across blocks; 0.0 = off
# --- block-internals ablation axes (all optional; defaults reproduce today's architecture) ---
weight_init: trunc_normal    # trunc_normal | normal | xavier_uniform | kaiming_uniform | cutting_skip
weight_init_std: 0.02        # for Gaussian-like initialisations
# Cutting-the-Skip (arxiv 2510.00345) attention init, only used when weight_init:
# cutting_skip. Not yet the default here: the paper's stabilisation claim is for
# SKIPLESS transformers (see BlockConfig.use_skip); with skip connections kept
# (our case), measurement showed ~3.8x weaker encoder gradient at init vs
# trunc_normal (docs/research -- Cutting-the-Skip validation, 2026-09-10), so
# this is an ablation axis to test, not a default to ship. Values below are the
# paper's ViT-S/self-supervised setting (the closest match to this arm).
weight_init_alpha: 1.8       # mimetic logits: alpha * Z + beta * I
weight_init_beta: 1.0
weight_init_c: 3.0           # V/O scaling constant used in the SVD-based value/output init
norm_type: layernorm       # layernorm | rmsnorm | centerednorm
mlp_type: gelu              # gelu | swiglu
qk_norm: false               # L2-normalise Q/K before the attention softmax
layer_scale_init: null       # null = off; float (e.g. 1e-5) = LayerScale init value
num_registers: 0             # extra learnable tokens (Darcet et al. 2023), encoder-internal only
layernorm_scaling: false     # scale block l's pre-norm outputs by 1/sqrt(l) (arXiv 2502.05795)
embed_norm: false            # LayerNorm on patch tokens before pos_embed
# --- SSL pretraining (Stage 1) ---
decoder_depth: 4
decoder_embed_dim: 256
decoder_num_heads: 8
mask_ratio: 0.9   # mask 90% of tubelets, keep 10% for visible encoding
motion_mask: false        # true -> mask highest-motion tubelets instead of random ones
mask_type: tube           # tube | frame | mixed; ignored when motion_mask is true.
                          # frame/mixed hide whole timesteps, removing tube masking's
                          # guarantee that a masked column is visible at another t
target_mode: time_avg     # time_avg | per_frame. per_frame keeps one patch per tubelet
                          # frame instead of averaging them, widening predict_head to
                          # tubelet_size*3*patch^2. Checkpoints are NOT interchangeable
                          # between modes -- predict_head shapes differ.
decoder_mask_ratio: 0.0   # V2 dual masking: fraction of masked tokens the decoder skips reconstructing (0.0 = reconstruct all, V1 behavior)
                          # >0.0 makes masked-token count data-dependent (torch.randperm-sliced in mae.py forward) -> breaks torch.compile's static-shape assumption; re-benchmark train.compile if enabling this

# --- E2b depth-collapse ablation (docs/research/2026-08-27-depth-collapse-3pool-prompt.md)
# All three default to the committed recipe, so arm A is bit-comparable to the
# runs already on the cluster. Set via EXTRA_OVERRIDES, not by editing this file.
visible_loss_weight: 0.0  # arm B: weight on an MSE term over the *visible* patches.
                          # Costs no extra decoder compute -- pred_full already spans
                          # all N tokens, so it is a second gather at keep_indices.
visible_loss_isolation_weighting: false
                          # Weight the arm-B term by 1-exp(-d), d = distance in the
                          # (H',W') plane to the nearest visible token outside this
                          # token's own tube. Isolated visible patches cannot be
                          # copied from a neighbour, so they are the ones whose
                          # content the residual stream must actually carry.
                          # Spreads best at mask_ratio 0.9 (six distinct weights);
                          # degenerates below ~0.5. Distance-to-nearest-MASKED was
                          # tried first and is a no-op at every ratio we run --
                          # see visible_isolation_weights' docstring.
deep_supervision_layers: []
                          # arm C: 1-based encoder blocks to also decode and penalise,
                          # e.g. [4, 8, 12]. Reuses the same decoder+head, so it tests
                          # "does this layer carry reconstructable information", not
                          # "can a private decoder learn to read it". Adds one decoder
                          # pass per listed layer.
