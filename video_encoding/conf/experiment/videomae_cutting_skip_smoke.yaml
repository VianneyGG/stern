# @package _global_
#
# Smoke test for the Cutting-the-Skip init (arXiv 2510.00345) on the real
# training path -- 1 node, no merge, frozen local-only shard set (node007,
# see shard_assignments_cutting-skip-smoke.json). Purpose is a real
# forward/backward loss and gradient-norm reading, not a converged model.

defaults:
  - override /train: ssl

experiment:
  name: videomae_cutting_skip_smoke
  description: "1-node smoke test of weight_init=cutting_skip against a real training step."
  stage: pretrain

model:
  weight_init: cutting_skip

mesh:
  rounds: 1
  steps_per_round: 20
  merge: false
  sync_timeout_s: 600.0
  subnet: "/254"

train:
  accum_steps: 1
  weight_decay: 0.05
  base_lr: 1.5e-4
  lr_mult: 1.0
  warmup_epochs: 0
  grad_clip: 1.0
  amp: bf16
