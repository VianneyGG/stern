# @package _global_
defaults:
  - override /dataset: veatic

# Ladder rung 4, candidate A (design.md "Rung 4 is two training runs, and the
# better one wins"): random-init end-to-end encoder + VA head. Trained only on
# the probe's rung-4 fit-split manifest (task 2.5), never the full VEATIC
# manifest -- specs/ssl-diag-ladder-rung4/spec.md forbids training on any clip
# the probe later scores every rung on.
experiment:
  name: ssl_diag_rung4_scratch
  description: "Ladder rung 4 candidate A: random-init encoder + VA head, end-to-end, trained on VEATIC's rung-4 fit-split manifest only."
  stage: va_finetune

dataset:
  manifest_path: ${oc.env:VEATIC_ROOT,???}/manifest_rung4_fit.csv

train:
  pretrain_encoder_path: null   # from scratch -- train/default.yaml's own default, set explicitly for this rung's record
  freeze_backbone: false        # rung 4 is the end-to-end encoder, not a frozen probe
