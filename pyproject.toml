[project]
name = "stern"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mediapipe>=0.10.35",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "tensorflow>=2.21.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "transformers>=4.45.0",
    "peft>=0.13.0",
    "hydra-core>=1.3.2",
    "h5py>=3.12.0",
    "einops>=0.8.0",
    "av>=13.0.0",
    "requests>=2.32.0",
    "yt-dlp>=2024.1.0",
    "tensorboard>=2.14.0",
    "imageio-ffmpeg>=0.6.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
