[project]
name = "stern"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "transformers>=4.45.0",
    "hydra-core>=1.3.2",
    "av>=13.0.0",
    "requests>=2.32.0",
    "tensorboard>=2.14.0",
    "decord>=0.6.0",
    "webdataset>=0.2.100",
    "matplotlib>=3.9.0",
    "marimo>=0.9.0",
]

# CUDA 12.8 torch for the fish cluster (RTX 3090, driver 595, cuda-12.6/12.9).
# Mirrors the What_Happens_Next repo, whose single uv env runs TF 2.21 + cu128
# torch on this same cluster — so the TF/torch CUDA coexistence CLAUDE.md flags
# is already proven here. macOS has no CUDA wheels and falls back to PyPI (CPU)
# via the marker.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "hypothesis>=6.167.1",
    "mutmut>=3.7.0",
    "pytest>=9.1.1",
]

[tool.mutmut]
# Scoped to the pure, stateless modules (no I/O, no torch/GPU) so a full
# mutation run stays cheap -- their existing test subset runs in ~13s.
source_paths = [
    "stern/data/harmonise.py",
    "stern/evaluation/ccc.py",
    "stern/mesh/quorum.py",
    "stern/mesh/outer_step.py",
]
pytest_add_cli_args_test_selection = [
    "tests/data/test_harmonise.py",
    "tests/data/test_harmonise_properties.py",
    "tests/evaluation/test_ccc.py",
    "tests/evaluation/test_ccc_properties.py",
    "tests/mesh/test_mesh_quorum.py",
    "tests/mesh/test_mesh_quorum_properties.py",
    "tests/mesh/test_mesh_outer_step.py",
]
also_copy = [
    "data/__init__.py",
    "data/tests",
    "eval/__init__.py",
    "eval/tests",
    "stern/__init__.py",
    "stern/mesh/__init__.py",
    "tests",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# mutmut copies source/test files under mutants/ to mutate them in isolation;
# without this, pytest collects both copies and errors on the duplicate
# module path. Setting norecursedirs replaces pytest's default list (which
# excludes hidden dirs via ".*"), so keep ".*" or nested .claude/worktrees/*
# checkouts get collected and error on duplicate module basenames.
norecursedirs = ["mutants", ".venv", ".*"]
# Tiering: unit tests are the unmarked default (no marker registered for them
# -- `-m unit` would select nothing, since pytest -m only matches an applied
# marker). Fast loop: `pytest -m "not integration and not system"`. Before a
# cluster deploy: `pytest -m system`.
markers = [
    "integration: exercises multiple real components together, external calls (subprocess/SLURM/ssh) typically mocked",
    "system: spawns a real subprocess (CLI script, bash launcher) with no mocking of the external call itself",
]
