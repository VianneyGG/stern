[project]
name = "stern"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mediapipe>=0.10.35",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "tensorflow>=2.21.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "transformers>=4.45.0",
    "peft>=0.13.0",
    "hydra-core>=1.3.2",
    "h5py>=3.12.0",
    "einops>=0.8.0",
    "av>=13.0.0",
    "requests>=2.32.0",
    "yt-dlp>=2024.1.0",
    "tensorboard>=2.14.0",
    "imageio-ffmpeg>=0.6.0",
]

# CUDA 12.8 torch for the fish cluster (RTX 3090, driver 595, cuda-12.6/12.9).
# Mirrors the What_Happens_Next repo, whose single uv env runs TF 2.21 + cu128
# torch on this same cluster — so the TF/torch CUDA coexistence CLAUDE.md flags
# is already proven here. macOS has no CUDA wheels and falls back to PyPI (CPU)
# via the marker.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
