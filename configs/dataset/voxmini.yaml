name: voxmini
role: ssl  # unlabelled SSL-adaptation set, never touches VA labels
# Present only on the nodes where the subset was staged, so presence comes from
# the environment (same convention as veatic.yaml): set VOXMINI_PRESENT=true there.
present: ${oc.decode:${oc.env:VOXMINI_PRESENT,false}}
path: ${oc.env:VOXMINI_ROOT,???}
manifest_path: ${.path}/manifest.csv
# Pre-decoded 8fps/224px JPEG cache (Workstream A4b) -- null means "not
# cached", and the SSL window dataset falls back to live mp4 decode from
# `path` in that case.
frames_path: ${oc.env:VOXMINI_FRAMES_ROOT,null}
target_hours: 218
seed: 42
