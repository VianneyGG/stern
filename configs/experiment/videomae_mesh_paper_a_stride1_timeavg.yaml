# @package _global_
#
# Paper-faithful mesh SSL recipe (docs/specs/2026-08-23-paper-faithful-mesh-recipe-design.md).
# Cell A of the 2x2: frame_stride=1 (2.0s span, matches VideoMAE's
# sampling_rate=4 on ~30fps), target_mode=time_avg.
#
# Requires the 8fps-reingested shard corpus to be seeded on every node in the
# assigned pool before launch.

defaults:
  - override /train: ssl

experiment:
  name: videomae_mesh_paper_a_stride1_timeavg
  description: "Paper-faithful mesh SSL recipe, cell A: frame_stride=1, target_mode=time_avg."
  stage: pretrain

mesh:
  rounds: 120
  # Micro-batches per round: H=150 optimizer steps x accum_steps 16.
  steps_per_round: 2400
  micro_batch_size: 16
  merge: true
  outer_lr: 0.7
  outer_momentum: 0.9
  lr_warmup_frac: 0.05
  lr_min: 1e-5
  # Coordinator-side, read from mesh_run_configs.json rather than from here --
  # recorded for intent; pass it at launch.
  quorum_k: 15
  chunk_rounds: 4
  round_budget_s: null
  sync_timeout_s: 1800.0
  subnet: "/254"

preprocess:
  window:
    frame_stride: 1
  augment: true

model:
  target_mode: time_avg
  decoder_embed_dim: 384
  decoder_num_heads: 6

train:
  # eff_batch = micro_batch_size(16) * accum_steps(16) = 256. _scaled_lr
  # derives lr = base_lr * 256/256 * lr_mult = 3e-4 as the schedule's peak.
  accum_steps: 16
  weight_decay: 0.05
  base_lr: 1.5e-4
  lr_mult: 2.0
  grad_clip: 1.0
  amp: bf16
