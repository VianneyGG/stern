# @package _global_
defaults:
  - override /dataset: afewva
  - override /model: levjepa_hf_large

# Ladder rung 4 (ssl-diag-03 design.md): the released LeVJEPA ViT-L fine-tuned
# end-to-end on AFEW-VA. Trained only on the probe's rung-4 fit-split manifest
# -- specs/ssl-diag-ladder-rung4/spec.md forbids training on any clip the probe
# later scores every rung on.
experiment:
  name: ssl_diag_rung4_levjepa_hf
  description: "Ladder rung 4: released LeVJEPA ViT-L fine-tuned end-to-end on AFEW-VA's rung-4 fit split."
  stage: va_finetune

dataset:
  manifest_path: ${oc.env:AFEWVA_ROOT,???}/manifest_rung4_fit.csv

train:
  pretrain_encoder_path: null   # the backbone arrives pretrained via model.weights_path
  freeze_backbone: false        # rung 4 is the end-to-end encoder, not a frozen probe
  optimizer: adamw
  learning_rate: 1.0e-5         # backbone; a pretrained ViT-L wants small steps
  head_lr_mult: 100.0           # head at 1e-3: it starts from random init
  weight_decay: 0.05
  warmup_epochs: 1
  epochs: 10
  amp_bf16: true
