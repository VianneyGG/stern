# @package _global_
defaults:
  - override /train: ssl

experiment:
  name: videomae_mesh_ssl
  description: "Decentralized mesh SSL pretraining -- consumes MESH_* env vars, bypasses cfg.dataset entirely (see training/mesh_round.py)."
  stage: pretrain

mesh:
  rounds: 10
  # Micro-batches per round (mesh_round.py's max_steps), NOT optimizer steps
  # -- with accum_steps=64 below this is 9600/64=150 optimizer steps/round
  # over fresh (post-shuffle) windows, vs the old 200/1=200 steps over the
  # same 200 windows replayed every round.
  steps_per_round: 9600
  merge: true
  outer_lr: 0.7
  outer_momentum: 0.9
  # Was 1800.0: a DEGRADED-recovery detour on 2026-09-08 took 33min end-to-end
  # (watcher.log lev-window-800 09:24-10:34), fatally killing every worker
  # that had already finished its round and was waiting on the sync flag.
  sync_timeout_s: 3600.0
  # Per-node pacing (mesh/pacing.py). null keeps the uniform steps_per_round
  # above for every node; each node instead trains what fits in this many
  # seconds at its own measured rate, so rounds finish together instead of
  # the fast nodes idling at the barrier (measured: 19.1% of all mesh
  # wall-clock, over 1455 rounds). Deliberately well under
  # watcher/mesh_tick.py's ROUND_TIMEOUT_S=900.0 (not this file's config --
  # a hardcoded module constant): a node paced to a local-training budget
  # anywhere near 900s would routinely miss the watcher's AWAITING_CHECKPOINTS
  # deadline before it even finishes training, since that 900s also has to
  # cover checkpoint push + merge + up to ~60s of cron tick-granularity slop
  # on top of local training. 750s leaves that margin; 9600 steps at the
  # observed median 9.91 steps/s would need ~970s, so this also slightly
  # reduces steps/round for paced nodes, not just redistributes them.
  round_budget_s: 750.0
  # Clamps as fractions of steps_per_round: the floor stops a degraded node
  # contributing a round of mostly-noise, the ceiling stops one bad rate
  # estimate stalling the mesh it was meant to unblock.
  step_floor_frac: 0.25
  step_ceil_frac: 2.0
  subnet: "/254"               # fish tier default (pick_nodes.sh); only affects P2P fetch preference, not correctness

train:
  # eff_batch = _MESH_BATCH_SIZE(1) * accum_steps = 64, landing on the
  # Phase-2 sweep's recommended eff_batch=128-256 lower shoulder;
  # _scaled_lr derives lr = base_lr * 64/256 * lr_mult automatically.
  accum_steps: 64
