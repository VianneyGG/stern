# Hyperparameter surface for stern/training/pretrain.py (MAE pretraining).
seed: 42
batch_size: 16           # SSL can tolerate smaller batches than CCC loss; reconstruction loss is per-sample
learning_rate: 1e-4      # match probe; adjust based on per-step efficiency (see plan self-critique #1)
epochs: 100              # SSL typically needs more epochs; VoxCeleb2 is 260 GB, so convergence is slower
checkpoint_root: ${oc.env:STERN_CHECKPOINT_ROOT,/tmp/stern_checkpoints}
results_root: ${oc.env:STERN_RESULTS_ROOT,.claude/results}

grad_clip: 1.0           # clip_grad_norm_ max-norm; 0.0 disables
resume: true             # resume from checkpoint_root/<experiment>/latest.pt (or best.pt) if present
save_latest: true        # write a per-epoch snapshot for crash/preemption recovery
accum_steps: 1           # micro-steps per optimizer step

# --- Scaling sweep / throughput benchmark (Phase 1) ---
max_steps: 0             # >0 caps micro-steps per epoch (short throughput cells); 0 = full epoch
num_workers: 8           # DataLoader workers (fish nodes have 16 cores)

# --- Optimization / convergence (Phase 2) ---
amp: bf16                # off | bf16 | fp16  (autocast precision)
compile: false           # torch.compile the model for mesh rounds; off until benchmarked on-cluster
compile_mode: default    # default | reduce-overhead | max-autotune (torch.compile's mode=)
weight_decay: 0.05       # AdamW weight decay (MAE convention)
base_lr: 1.5e-4          # LR at reference batch 256; actual lr = base_lr * eff_batch/256 * lr_mult
lr_mult: 1.0             # extra multiplier on the linear-scaling rule
warmup_epochs: 5         # linear warmup before cosine decay

ddp:
  bucket_cap_mb: 25      # tuned for 1GbE fabric (same as default)
  grad_compress: ""      # "" | "fp16"
  nccl_timeout_sec: 300
  find_unused_parameters: false
  backend: nccl
  nccl_env: {}
