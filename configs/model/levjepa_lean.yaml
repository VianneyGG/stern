# Lean LeVJEPA: levjepa_base with the "Leaner Transformers: More Heads, Less
# Depth" geometry (arXiv 2505.20802) -- depth 12->7, heads 12->16 (head_dim
# 48), mlp_ratio 4.0->2.0. The geometry used by the lev-sigfix-cars-20r run.
# No pretrained weights.
name: levjepa_lean
encoder: levjepa
# --- input geometry ---
num_frames: 16
image_size: 224
local_image_size: 96
in_channels: 3
patch_size: 16
# --- transformer ---
embed_dim: 768
depth: 7
num_heads: 16
mlp_ratio: 2.0
dropout: 0.0
drop_path_rate: 0.0
# --- LeVJEPA objective (Section 3, Balestriero & LeCun's LeJEPA recipe) ---
drop_ratio: 0.95          # fraction of patch tokens dropped per forward pass (train only)
num_local_views: 4        # V in the paper; local views per global view
sigreg_lambda: 0.02       # fixed per paper (Balestriero & LeCun), NOT tuned -- do not sweep
sigreg_directions: 1024   # M in Eq. 3
projector_hidden: 2048
embed_dim_k: 256          # K, the SIGReg/invariance embedding space dim
polyak_decay: 0.9999      # eval-only shadow weights, no role in the training objective
polyak_update_every: 32   # steps
grad_checkpoint: false    # recompute blocks in backward; exact (n1004 equiv test)
